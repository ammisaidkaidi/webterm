<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>terminal</title>
<link rel="stylesheet" href="/static/vendor/xterm.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>▮</text></svg>" />
<style>
  :root{
    --bg:#0e0e11;
    --panel:#141418;
    --line:#232329;
    --fg:#e6e6e9;
    --dim:#71717a;
    --ok:#4ade80;
    --off:#f87171;
    --hit:#26262e;
    --sel:#33333d;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fbfbfc; --panel:#fff; --line:#e6e6ea; --fg:#18181b; --dim:#8a8a93; --hit:#ececf1; --sel:#cfe0ff; }
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; overscroll-behavior:none; }
  body{
    background:var(--bg); color:var(--fg);
    font:13px/1.4 ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  header{
    display:flex; align-items:center; gap:10px;
    padding:0 14px; height:38px; flex:0 0 38px;
    border-bottom:1px solid var(--line); background:var(--panel);
    user-select:none;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--off); flex:0 0 auto; transition:background .2s; }
  .dot.on{ background:var(--ok); }
  .title{ color:var(--dim); letter-spacing:.04em; }
  .title.flash{ color:var(--ok); }
  .spacer{ flex:1; }
  header button{
    font:inherit; color:var(--dim); background:transparent;
    border:1px solid var(--line); border-radius:6px;
    padding:3px 9px; cursor:pointer;
  }
  header button:hover{ color:var(--fg); border-color:var(--dim); }
  header button:active{ transform:translateY(1px); }

  main{ flex:1; min-height:0; padding:8px 10px; position:relative; }
  #term{ height:100%; }
  .xterm-viewport::-webkit-scrollbar{ width:8px; }
  .xterm-viewport::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
  .xterm-viewport{ scrollbar-width:thin; }
  /* let the browser's own selection UI work inside xterm's DOM layers */
  .xterm .xterm-screen, .xterm .xterm-rows{ user-select:text; -webkit-user-select:text; }

  /* select mode: plain selectable text over the terminal */
  #sel{
    display:none; position:absolute; inset:8px 10px;
    margin:0; padding:0 2px; overflow:auto;
    background:var(--bg); color:var(--fg);
    font:13px/1.25 ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    white-space:pre-wrap; word-break:break-word;
    user-select:text; -webkit-user-select:text; -webkit-touch-callout:default;
    cursor:text;
  }
  body.selmode #sel{ display:block; }
  body.selmode #term{ visibility:hidden; }
  #sel::selection, #sel *::selection{ background:var(--sel); }
  .hint{
    position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--line); border-radius:999px;
    padding:4px 12px; color:var(--dim); font-size:12px; pointer-events:none;
    display:none; white-space:nowrap;
  }
  body.selmode .hint{ display:block; }

  /* floating button */
  .fab{
    position:fixed; right:16px; bottom:calc(58px + env(safe-area-inset-bottom));
    width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel); color:var(--fg);
    border:1px solid var(--line); cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.28);
    z-index:40; transition:transform .15s, border-color .15s;
  }
  .fab:hover{ border-color:var(--dim); }
  .fab:active{ transform:scale(.94); }
  .fab svg{ width:20px; height:20px; }

  /* file browser */
  .scrim{
    position:fixed; inset:0; background:rgba(0,0,0,.45);
    opacity:0; pointer-events:none; transition:opacity .18s; z-index:45;
  }
  body.files .scrim{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; top:0 ; right:0; height:100%; width:min(380px,88vw);
    background:var(--panel); border-left:1px solid var(--line);
    transform:translateX(100%); transition:transform .2s ease;
    z-index:50; display:flex; flex-direction:column;
  }
  body.files .drawer{ transform:none; }
  .drawer .top{
    display:flex; align-items:center; gap:8px;
    padding:9px 10px; border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  .drawer .top b{ font-weight:600; letter-spacing:.03em; }
  .mini{
    font:inherit; font-size:12px; color:var(--dim); background:transparent;
    border:1px solid var(--line); border-radius:6px; padding:2px 7px; cursor:pointer;
  }
  .mini:hover{ color:var(--fg); border-color:var(--dim); }
  .mini.on{ color:var(--bg); background:var(--fg); border-color:var(--fg); }
  .crumbs{
    display:flex; flex-wrap:wrap; gap:2px; align-items:center;
    padding:7px 10px; border-bottom:1px solid var(--line);
    font-size:12px; color:var(--dim); flex:0 0 auto; max-height:70px; overflow:auto;
  }
  .crumbs button{
    font:inherit; color:var(--dim); background:transparent; border:0;
    padding:1px 3px; border-radius:4px; cursor:pointer;
  }
  .crumbs button:hover{ color:var(--fg); background:var(--hit); }
  .crumbs span{ opacity:.5; }
  .list{ flex:1; overflow:auto; padding:4px 0; }
  .row{
    display:flex; align-items:center; gap:9px;
    padding:6px 10px; cursor:pointer; user-select:none;
  }
  .row:hover{ background:var(--hit); }
  .row .ic{ flex:0 0 14px; color:var(--dim); display:flex; }
  .row .ic svg{ width:14px; height:14px; }
  .row .nm{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row.d .nm{ font-weight:500; }
  .row.x .nm{ color:var(--ok); }
  .row .sz{ flex:0 0 auto; font-size:11px; color:var(--dim); }
  .row .go{
    flex:0 0 auto; font-size:11px; color:var(--dim); opacity:0;
    border:1px solid var(--line); border-radius:5px; padding:1px 5px;
  }
  .row:hover .go{ opacity:1; }
  .row .go:hover{ color:var(--fg); }
  .empty{ padding:14px 12px; color:var(--dim); font-size:12px; }

  /* bottom key bar */
  nav{
    flex:0 0 auto;
    display:flex; gap:6px; align-items:center;
    padding:7px 10px calc(7px + env(safe-area-inset-bottom));
    background:var(--panel); border-top:1px solid var(--line);
    overflow-x:auto; overflow-y:hidden;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
    user-select:none; -webkit-user-select:none;
  }
  nav::-webkit-scrollbar{ display:none; }
  .k{
    flex:0 0 auto;
    min-width:34px; height:30px; padding:0 9px;
    display:inline-flex; align-items:center; justify-content:center;
    font:inherit; color:var(--fg); background:transparent;
    border:1px solid var(--line); border-radius:7px;
    cursor:pointer; touch-action:manipulation;
    transition:background .12s,border-color .12s,color .12s;
  }
  .k:hover{ border-color:var(--dim); }
  .k.hit{ background:var(--hit); }
  .k.on{ color:var(--bg); background:var(--fg); border-color:var(--fg); }
  .k.wide{ font-size:12px; letter-spacing:.03em; }
  .sep{ flex:0 0 auto; width:1px; height:18px; background:var(--line); margin:0 2px; }
</style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <span class="title" id="status">connecting</span>
    <span class="spacer"></span>
    <button id="clear" title="Clear screen">clear</button>
    <button id="reconnect" title="Restart the shell">restart</button>
  </header>

  <main>
    <div id="term"></div>
    <pre id="sel" tabindex="0"></pre>
    <div class="hint">select the text, then tap <b>copy</b> — or <b>sel</b> to go back</div>
  </main>

  <nav id="keys" aria-label="terminal keys"></nav>

  <button class="fab" id="fab" title="Files (Ctrl+Shift+F)" aria-label="open file browser">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    </svg>
  </button>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="file browser">
    <div class="top">
      <b>files</b>
      <span class="spacer" style="flex:1"></span>
      <button class="mini" id="f-sync" title="Jump to the shell's current directory">sync</button>
      <button class="mini" id="f-hidden" title="Show dotfiles">.*</button>
      <button class="mini" id="f-reload" title="Reload">↻</button>
      <button class="mini" id="f-close" title="Close">✕</button>
    </div>
    <div class="crumbs" id="f-crumbs"></div>
    <div class="list" id="f-list"></div>
  </aside>

  <script src="/static/vendor/xterm.js"></script>
  <script src="/static/vendor/addon-fit.js"></script>
  <script src="/static/vendor/addon-weblinks.js"></script>
  <script>
  (function () {
    const dark = !window.matchMedia("(prefers-color-scheme: light)").matches;
    const theme = dark
      ? { background:"#0e0e11", foreground:"#e6e6e9", cursor:"#e6e6e9",
          selectionBackground:"#33333d", selectionForeground:"#ffffff",
          black:"#0e0e11", brightBlack:"#52525b" }
      : { background:"#fbfbfc", foreground:"#18181b", cursor:"#18181b",
          selectionBackground:"#cfe0ff", selectionForeground:"#18181b" };

    const term = new Terminal({
      theme,
      fontFamily: 'ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace',
      fontSize: 13,
      lineHeight: 1.25,
      cursorBlink: true,
      scrollback: 10000,
      allowProposedApi: true,
      macOptionIsMeta: true,
      rightClickSelectsWord: true,
      altClickMovesCursor: false,
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    try { term.loadAddon(new WebLinksAddon.WebLinksAddon()); } catch (e) {}
    term.open(document.getElementById("term"));
    fit.fit();
    term.focus();

    const dot = document.getElementById("dot");
    const status = document.getElementById("status");
    const selPane = document.getElementById("sel");
    const token = new URLSearchParams(location.search).get("token") || "";
    let ws = null, closedByUser = false, retry = 0, baseStatus = "connecting", sid = "";

    function setState(on, text) { baseStatus = text; dot.classList.toggle("on", on); status.textContent = text; }
    let flashT;
    function flash(msg) {                       // transient note in the status slot
      status.textContent = msg; status.classList.add("flash");
      clearTimeout(flashT);
      flashT = setTimeout(() => { status.textContent = baseStatus; status.classList.remove("flash"); }, 1200);
    }
    const send = (o) => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(o)); };
    const sendSize = () => send({ t: "r", rows: term.rows, cols: term.cols });

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const q = new URLSearchParams({ rows: term.rows, cols: term.cols });
      if (token) q.set("token", token);
      ws = new WebSocket(`${proto}://${location.host}/ws?${q}`);
      ws.onopen = () => { retry = 0; setState(true, "connected"); sendSize(); term.focus(); };
      ws.onmessage = (ev) => {
        const m = JSON.parse(ev.data);
        if (m.t === "o") term.write(m.d);
        else if (m.t === "sid") sid = m.d;          // lets /api/ls follow this shell's cwd
        else if (m.t === "exit") { setState(false, "shell exited"); term.writeln("\r\n\x1b[90m[process exited]\x1b[0m"); }
      };
      ws.onclose = (ev) => {
        setState(false, ev.code === 4401 ? "unauthorized" : "disconnected");
        if (closedByUser || ev.code === 4401) return;
        retry = Math.min(retry + 1, 6);
        setTimeout(connect, 400 * retry);
      };
    }

    /* ---------- clipboard (works on http too, via execCommand fallback) ---------- */
    async function toClipboard(text) {
      if (!text) { flash("nothing selected"); return false; }
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          flash("copied " + text.length + " chars"); return true;
        }
      } catch (e) {}
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
        document.body.appendChild(ta);
        ta.select(); ta.setSelectionRange(0, text.length);
        const ok = document.execCommand("copy");
        ta.remove();
        flash(ok ? "copied " + text.length + " chars" : "copy blocked");
        return ok;
      } catch (e) { flash("copy blocked"); return false; }
    }

    async function fromClipboard() {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          const t = await navigator.clipboard.readText();
          if (t) { term.paste(t); flash("pasted"); return; }
        }
      } catch (e) {}
      flash("press Ctrl+V / ⌘V");      // browser-native paste still reaches xterm
      term.focus();
    }

    // what to copy: xterm selection → select-pane selection → nothing
    function currentSelection() {
      const docSel = String(window.getSelection() || "");
      if (document.body.classList.contains("selmode")) return docSel;
      return term.getSelection() || docSel;
    }
    const copySelection = () => toClipboard(currentSelection());

    // desktop convention: releasing a drag-selection copies it
    document.getElementById("term").addEventListener("mouseup", (e) => {
      const s = term.getSelection();
      if (s) { if (e.button === 0) toClipboard(s); return; }     // don't steal the selection
      if (!String(window.getSelection() || "")) term.focus();
    });
    // middle-click paste, X11 style
    document.getElementById("term").addEventListener("auxclick", (e) => {
      if (e.button === 1) { e.preventDefault(); fromClipboard(); }
    });

    /* ---------- select mode: real, selectable text (works with touch) ---------- */
    function bufferText() {
      const b = term.buffer.active;
      const out = [];
      for (let i = 0; i < b.length; i++) {
        const line = b.getLine(i);
        if (!line) continue;
        let s = line.translateToString(true);
        // join xterm's wrapped continuation rows back into one logical line
        if (line.isWrapped && out.length) out[out.length - 1] += s;
        else out.push(s);
      }
      while (out.length && !out[out.length - 1].trim()) out.pop();
      return out.join("\n");
    }

    function setSelMode(on) {
      document.body.classList.toggle("selmode", on);
      document.querySelectorAll('.k[data-act="sel"]').forEach(b => b.classList.toggle("on", on));
      if (on) {
        selPane.textContent = bufferText();
        selPane.scrollTop = selPane.scrollHeight;
        const sel = term.getSelection();
        if (!sel) { window.getSelection().removeAllRanges(); }
        flash("select mode");
      } else {
        window.getSelection().removeAllRanges();
        term.focus();
        setState(dot.classList.contains("on"), baseStatus);
      }
    }
    const toggleSel = () => setSelMode(!document.body.classList.contains("selmode"));

    /* ---------- sticky modifiers ---------- */
    const mod = { ctrl: false, alt: false };
    function setMod(name, on) {
      mod[name] = on;
      document.querySelectorAll(`.k[data-mod="${name}"]`).forEach(b => b.classList.toggle("on", on));
    }
    const clearMods = () => { setMod("ctrl", false); setMod("alt", false); };

    function emit(data) {
      if (!data) return;
      if (mod.ctrl && data.length === 1) {
        const c = data.toUpperCase().charCodeAt(0);
        if (c >= 63 && c <= 95) data = String.fromCharCode(c - 64);
        else if (c === 32) data = "\x00";
      }
      if (mod.alt) data = "\x1b" + data;
      clearMods();
      send({ t: "i", d: data });
    }
    term.onData(emit);

    /* ---------- keyboard shortcuts ---------- */
    term.attachCustomKeyEventHandler((e) => {
      if (e.type !== "keydown") return true;
      const k = e.key.toLowerCase();
      // xterm stopPropagation()s keys it handles, so Esc must be caught here too
      if (e.key === "Escape" && drawer.open) { closeFiles(); return false; }
      if (e.ctrlKey && e.shiftKey && k === "c") { copySelection(); return false; }
      if (e.ctrlKey && e.shiftKey && k === "v") { fromClipboard(); return false; }
      if (e.ctrlKey && e.shiftKey && k === "a") { setSelMode(true); selectAllPane(); return false; }
      if (e.ctrlKey && e.shiftKey && k === "f") { toggleFiles(); return false; }
      if (e.ctrlKey && e.key === "Insert") { copySelection(); return false; }
      if (e.shiftKey && e.key === "Insert") { fromClipboard(); return false; }
      // Ctrl-C with an active selection copies; with none it still interrupts
      if (e.ctrlKey && !e.shiftKey && k === "c" && term.getSelection()) {
        copySelection(); term.clearSelection(); return false;
      }
      return true;
    });

    function selectAllPane() {
      const r = document.createRange();
      r.selectNodeContents(selPane);
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    }

    /* ---------- bottom key bar ---------- */
    const KEYS = [
      { l: "esc",  d: "\x1b",   t: "Escape" },
      { l: "tab",  d: "\t",     t: "Tab — complete", wide: true },
      { l: "ctrl", mod: "ctrl", t: "Ctrl (sticky — tap, then a key)", wide: true },
      { l: "alt",  mod: "alt",  t: "Alt / Meta (sticky)", wide: true },
      { sep: true },
      { l: "sel",  act: "sel",  t: "Select mode — selectable text for touch copy", wide: true },
      { l: "copy", act: "copy", t: "Copy selection (Ctrl+Shift+C)", wide: true },
      { l: "paste",act: "paste",t: "Paste (Ctrl+Shift+V)", wide: true },
      { l: "all",  act: "all",  t: "Select everything on screen", wide: true },
      { sep: true },
      { l: "↑", d: "\x1b[A", t: "Previous command", rep: true },
      { l: "↓", d: "\x1b[B", t: "Next command",     rep: true },
      { l: "←", d: "\x1b[D", t: "Left",  rep: true },
      { l: "→", d: "\x1b[C", t: "Right", rep: true },
      { sep: true },
      { l: "^C", d: "\x03", t: "Interrupt" },
      { l: "^D", d: "\x04", t: "EOF / exit" },
      { l: "^Z", d: "\x1a", t: "Suspend" },
      { l: "^R", d: "\x12", t: "Reverse history search" },
      { sep: true },
      { l: "⇱", d: "\x01", t: "Start of line (Ctrl-A)" },
      { l: "⇲", d: "\x05", t: "End of line (Ctrl-E)" },
      { l: "⌫", d: "\x7f", t: "Backspace", rep: true },
      { sep: true },
      { l: "|", d: "|" },
      { l: "~", d: "~" },
      { l: "/", d: "/" },
      { l: "-", d: "-" },
      { l: "↵", d: "\r", t: "Enter" },
    ];

    const ACTIONS = {
      sel: toggleSel,
      copy: () => copySelection(),
      paste: fromClipboard,
      all: () => {
        if (!document.body.classList.contains("selmode")) setSelMode(true);
        selectAllPane();
        flash("selected all");
      },
    };

    const nav = document.getElementById("keys");
    for (const k of KEYS) {
      if (k.sep) { const s = document.createElement("span"); s.className = "sep"; nav.appendChild(s); continue; }
      const b = document.createElement("button");
      b.className = "k" + (k.wide ? " wide" : "");
      b.textContent = k.l;
      b.title = k.t || k.l;
      b.type = "button";
      if (k.mod) b.dataset.mod = k.mod;
      if (k.act) b.dataset.act = k.act;

      // never steal focus or clear the user's selection
      b.addEventListener("mousedown", (e) => e.preventDefault());
      b.addEventListener("touchstart", (e) => e.preventDefault(), { passive: false });

      let holdT, repT;
      const press = () => {
        b.classList.add("hit");
        setTimeout(() => b.classList.remove("hit"), 110);
        if (k.act) { ACTIONS[k.act](); return; }
        if (k.mod) { setMod(k.mod, !mod[k.mod]); return; }
        if (document.body.classList.contains("selmode")) setSelMode(false);
        emit(k.d);
        term.focus();
      };
      const stop = () => { clearTimeout(holdT); clearInterval(repT); };

      b.addEventListener("pointerdown", () => {
        press();
        if (!k.rep) return;
        holdT = setTimeout(() => { repT = setInterval(() => { send({ t: "i", d: k.d }); }, 70); }, 420);
      });
      ["pointerup", "pointerleave", "pointercancel"].forEach(ev => b.addEventListener(ev, stop));
      nav.appendChild(b);
    }

    /* ---------- file browser ---------- */
    const drawer = { path: null, hidden: false, open: false };
    const fList = document.getElementById("f-list");
    const fCrumbs = document.getElementById("f-crumbs");

    const ICON = {
      dir: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
      file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
      link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
    };

    const human = (n) => {
      if (n < 1024) return n + " B";
      const u = ["K", "M", "G", "T"]; let i = -1;
      do { n /= 1024; i++; } while (n >= 1024 && i < 3);
      return (n < 10 ? n.toFixed(1) : Math.round(n)) + u[i];
    };
    // POSIX-safe single quoting, so spaces and quotes in names can't break the command
    const q = (s) => "'" + s.replace(/'/g, "'\\''") + "'";
    const join = (dir, name) => (dir.endsWith("/") ? dir + name : dir + "/" + name);

    async function loadDir(path) {
      const p = new URLSearchParams({ path: path || "", hidden: drawer.hidden ? 1 : 0 });
      if (sid) p.set("sid", sid);
      if (token) p.set("token", token);
      fList.innerHTML = '<div class="empty">loading…</div>';
      let d;
      try {
        const r = await fetch("/api/ls?" + p);
        if (!r.ok) { fList.innerHTML = `<div class="empty">${r.status === 403 ? "permission denied" : "cannot open"}</div>`; return; }
        d = await r.json();
      } catch (e) { fList.innerHTML = '<div class="empty">request failed</div>'; return; }

      drawer.path = d.path;
      renderCrumbs(d);
      renderList(d);
    }

    function renderCrumbs(d) {
      fCrumbs.innerHTML = "";
      const mk = (label, path) => {
        const b = document.createElement("button");
        b.textContent = label; b.onclick = () => loadDir(path);
        fCrumbs.appendChild(b);
      };
      mk("/", "/");
      let acc = "";
      d.path.split("/").filter(Boolean).forEach((part, i) => {
        acc += "/" + part;
        if (i) { const s = document.createElement("span"); s.textContent = "/"; fCrumbs.appendChild(s); }
        mk(part, acc);
      });
    }

    function renderList(d) {
      fList.innerHTML = "";
      if (d.parent !== null) {
        const up = document.createElement("div");
        up.className = "row d";
        up.innerHTML = `<span class="ic">${ICON.dir}</span><span class="nm">..</span>`;
        up.onclick = () => loadDir(d.parent);
        fList.appendChild(up);
      }
      if (!d.entries.length) {
        const e = document.createElement("div");
        e.className = "empty"; e.textContent = "empty directory";
        fList.appendChild(e);
      }
      for (const it of d.entries) {
        const full = join(d.path, it.name);
        const row = document.createElement("div");
        row.className = "row" + (it.dir ? " d" : "") + (it.exe ? " x" : "");
        row.innerHTML =
          `<span class="ic">${it.link ? ICON.link : it.dir ? ICON.dir : ICON.file}</span>` +
          `<span class="nm"></span>` +
          (it.dir ? "" : `<span class="sz">${human(it.size)}</span>`) +
          `<span class="go">${it.dir ? "cd" : "⤓"}</span>`;
        row.querySelector(".nm").textContent = it.name;      // textContent: no HTML injection from filenames
        row.title = full;

        row.onclick = () => {
          if (it.dir) loadDir(full);
          // file → type its path at the prompt, then hand focus back so you can keep typing
          else { send({ t: "i", d: q(full) }); term.focus(); flash("path inserted"); }
        };
        row.querySelector(".go").onclick = (ev) => {
          ev.stopPropagation();
          // \x15 (kill-line) first: the prompt may already hold a path you inserted
          if (it.dir) { send({ t: "i", d: "\x15cd " + q(full) + "\n" }); closeFiles(); flash("cd " + it.name); }
          else {
            const p = new URLSearchParams({ path: full });
            if (token) p.set("token", token);
            const a = document.createElement("a");
            a.href = "/api/download?" + p; a.download = it.name;
            document.body.appendChild(a); a.click(); a.remove();
          }
        };
        fList.appendChild(row);
      }
      if (d.truncated) {
        const t = document.createElement("div");
        t.className = "empty"; t.textContent = "… listing truncated at 2000 entries";
        fList.appendChild(t);
      }
    }

    function openFiles()  { drawer.open = true;  document.body.classList.add("files"); loadDir(drawer.path || ""); }
    function closeFiles() { drawer.open = false; document.body.classList.remove("files"); term.focus(); }
    const toggleFiles = () => (drawer.open ? closeFiles() : openFiles());

    document.getElementById("fab").onclick = toggleFiles;
    document.getElementById("scrim").onclick = closeFiles;
    document.getElementById("f-close").onclick = closeFiles;
    document.getElementById("f-reload").onclick = () => loadDir(drawer.path || "");
    document.getElementById("f-sync").onclick = () => loadDir("");          // "" = follow the shell
    document.getElementById("f-hidden").onclick = (e) => {
      drawer.hidden = !drawer.hidden;
      e.currentTarget.classList.toggle("on", drawer.hidden);
      loadDir(drawer.path || "");
    };
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && drawer.open) { closeFiles(); e.preventDefault(); }
    });

    /* ---------- resize / header buttons ---------- */
    let rt;
    const resize = () => { clearTimeout(rt); rt = setTimeout(() => { fit.fit(); sendSize(); }, 60); };
    window.addEventListener("resize", resize);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
    new ResizeObserver(resize).observe(document.getElementById("term"));

    document.getElementById("clear").onclick = () => { setSelMode(false); term.clear(); term.focus(); };
    document.getElementById("reconnect").onclick = () => {
      closedByUser = true; setSelMode(false);
      if (ws) ws.close();
      term.reset(); clearMods();
      setState(false, "restarting");
      setTimeout(() => { closedByUser = false; connect(); }, 150);
    };

    connect();
  })();
  </script>
</body>
</html>
